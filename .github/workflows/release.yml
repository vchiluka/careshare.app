# On every push to release (the production branch): apply pending migrations to production.
# Vercel builds the same commit for production; with "Auto-assign Custom Production Domains" off, that
# build waits for a manual Promote after the smoke test. Production is never seeded and a migration is
# never reverted here (scripts/migrate.ts refuses --down when CARESHARE_ENV=production).
name: release

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate production
        run: npm run db:migrate
        env:
          CARESHARE_ENV: production
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_PROD_UNPOOLED }}
